{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Yield Calculator | SAMS</title>
    <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <img src="{% static 'SAMSlogo.png' %}" alt="SAMS logo">
            <div>
                <div class="brand-name">SAMS</div>
                <div class="brand-sub">Smart Agriculture Management System</div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">Home</a>
            <a href="{% url 'finance' %}">Calculator</a>
            <a href="{% url 'cropyeild' %}">Yield</a>
            <a href="{% url 'production' %}">Production</a>
            <a href="{% url 'soil_classification' %}">Soil</a>
            <a href="{% url 'signout' %}">Log out</a>
        </nav>
    </header>

    <main class="page">
        <div class="form-card">
            <h1>Crop Yield Calculator</h1>
            <form id="crop-yield-calculator" method="post">
                {% csrf_token %}
                <label for="crop-weight">Weight of Crop (kg)</label>
                <input type="number" id="crop-weight" name="weight" step="any" required>
                <label for="land-area">Land Area (acres)</label>
                <input type="number" id="land-area" name="area" step="any" required>
                <button type="submit" class="btn">Calculate</button>
            </form>
            {% if ans %}<p class="result" id="yield-result">{{ ans }}</p>{% endif %}
        </div>
    </main>
</body>
</html>
