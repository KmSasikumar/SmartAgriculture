{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SAMS</title>
    <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <img src="{% static 'SAMSlogo.png' %}" alt="SAMS logo">
            <div>
                <div class="brand-name">SAMS</div>
                <div class="brand-sub">Smart Agriculture Management System</div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">Home</a>
            <a href="{% url 'sign' %}">Sign in</a>
        </nav>
    </header>

    <main class="page">
        <div class="form-card">
            <h1>Smart Agriculture Management System</h1>
            {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
            <form method="post" action="">
                {% csrf_token %}
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" placeholder="First Name" required>
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" placeholder="Last Name" required>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required>
                <label for="mail">Email</label>
                <input type="email" id="mail" name="mail" placeholder="Email" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <label for="confirmpassword">Confirm Password</label>
                <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm Password" required>
                <label><input type="checkbox" id="terms"> Agree Terms and Conditions</label>
                <button type="submit" class="btn" name="signin">Sign In</button>
            </form>
        </div>
    </main>
</body>
</html>
