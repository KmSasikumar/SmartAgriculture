{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Monitoring System | SAMS</title>
    <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <img src="{% static 'SAMSlogo.png' %}" alt="SAMS logo">
            <div>
                <div class="brand-name">SAMS</div>
                <div class="brand-sub">Smart Agriculture Management System</div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">Home</a>
            <a href="{% url 'finance' %}">Calculator</a>
            <a href="{% url 'cropyeild' %}">Yield</a>
            <a href="{% url 'production' %}">Production</a>
            <a href="{% url 'soil_classification' %}">Soil</a>
            <a href="{% url 'signout' %}">Log out</a>
        </nav>
    </header>

    <main class="page">
        <div class="form-card">
            <h1>Crop Information</h1>
            <div id="data-display">
                <!-- Crop data will be displayed here -->
            </div>
        </div>
        <div class="form-card" style="margin-top: 1rem;">
            <h1>Weather Forecast</h1>
            <label for="weather-city">City</label>
            <input type="text" id="weather-city" value="Bengaluru">
            <button type="button" class="btn" id="weather-search">Search</button>
            <div id="weather-display">
                <!-- Weather forecast data will be displayed here -->
            </div>
        </div>
    </main>
    <script src="{% static 'web.js' %}"></script>
</body>
</html>
