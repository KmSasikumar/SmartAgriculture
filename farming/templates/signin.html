{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | SAMS</title>
    <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <img src="{% static 'SAMSlogo.png' %}" alt="SAMS logo">
            <div>
                <div class="brand-name">SAMS</div>
                <div class="brand-sub">Smart Agriculture Management System</div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">Home</a>
            <a href="{% url 'register' %}">Register</a>
        </nav>
    </header>

    <main class="page">
        <div class="form-card">
            <h1>Sign in</h1>
            <form method="post" id="signin-form">
                {% csrf_token %}
                <label for="username">Username</label>
                <input type="text" id="username" name="Username" placeholder="Username" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn" name="signin">Sign In</button>
                <a class="btn btn-secondary" href="{% url 'register' %}">Register</a>
            </form>
        </div>
    </main>
</body>
</html>
